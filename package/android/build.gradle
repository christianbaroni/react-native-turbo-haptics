def isNewArchitectureEnabled() {
    return project.hasProperty("newArchEnabled") && project.newArchEnabled == "true"
}

def safeExtGet(prop, fallback) {
    rootProject.ext.has(prop) ? rootProject.ext.get(prop) : fallback
}

plugins {
    id 'com.android.library'
    id 'org.jetbrains.kotlin.android'
}

def newArchitectureEnabled = isNewArchitectureEnabled()

if (newArchitectureEnabled) {
    apply plugin: 'com.facebook.react'
}

android {
    namespace "com.turbohaptics"
    compileSdkVersion Math.max(34, safeExtGet('compileSdkVersion', 34))

    // Used to override the NDK path/version on internal CI or by allowing
    // users to customize the NDK path/version from their root project.
    if (rootProject.hasProperty("ndkPath")) {
        ndkPath rootProject.ext.ndkPath
    }
    if (rootProject.hasProperty("ndkVersion")) {
        ndkVersion rootProject.ext.ndkVersion
    }

    buildFeatures {
        prefab true
    }

    packaging {
        jniLibs {
            excludes += [
                    "**/libc++_shared.so",
                    "**/libfbjni.so",
                    "**/libjsi.so",
                    "**/libreactnative.so",
            ]
        }
    }

    defaultConfig {
        minSdkVersion safeExtGet('minSdkVersion', 21)
        targetSdkVersion safeExtGet('targetSdkVersion', 33)
        externalNativeBuild {
            cmake {
                arguments "-DANDROID_STL=c++_shared",
                        "-DANDROID_SUPPORT_FLEXIBLE_PAGE_SIZES=ON",
                        "-DTURBO_HAPTICS_NEW_ARCHITECTURE=${newArchitectureEnabled}"
            }
        }
    }

    sourceSets {
        main {
            if (newArchitectureEnabled) {
                java.srcDirs += [
                        'src/fabric',
                        // Codegen output directory
                        project.file("${project.buildDir}/generated/source/codegen/java")
                ]
            } else {
                java.srcDirs += ['src/paper']
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    externalNativeBuild {
        cmake {
            path "src/main/jni/CMakeLists.txt"
        }
    }
}

dependencies {
    implementation "org.jetbrains.kotlin:kotlin-stdlib"
    compileOnly "com.facebook.react:react-native:${safeExtGet('reactNativeVersion', '+')}"

    testImplementation "junit:junit:4.13.2"
    testImplementation "org.robolectric:robolectric:4.13"
    testImplementation "com.facebook.react:react-native:${safeExtGet('reactNativeVersion', '+')}"
}
